[package]
name = "prism-reference-manager"
description = "Prism Reference Manager desktop window"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "prm_app"
crate-type = ["rlib"]

[[bin]]
name = "prism-reference-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
prm-core = { path = "../../crates/prm-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
chrono.workspace = true
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
