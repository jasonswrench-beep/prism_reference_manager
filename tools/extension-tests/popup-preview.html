<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Popup preview</title>
  <meta name="citation_title" content="Teaching with generative AI">
  <meta name="citation_author" content="Chen, Li">
  <meta name="citation_author" content="Maya Patel">
  <meta name="citation_journal_title" content="Journal of Teaching Practice">
  <meta name="citation_publication_date" content="2024/03/05">
  <meta name="citation_doi" content="10.5555/jtp.2024.12.2.115">
  <meta name="citation_pdf_url" content="https://example.org/articles/jtp-2024-115.pdf">
  <link rel="stylesheet" href="../../extension/popup.css">
</head>
<body>
  <!-- Preview only: stand-ins for the browser extension APIs and the program's replies. -->
  <header><img src="../../extension/icons/icon-32.png" alt="" width="20" height="20"><span>Prism Reference Manager</span></header>
  <main id="root" aria-live="polite"></main>
  <a href="https://doi.org/10.5555/jhep.2022.1042" hidden>Faculty development in the age of AI</a>
  <script type="module">
    import { extractPage } from "../../extension/extract.js";
    window.sent = null;
    window.chrome = {
      storage: { local: { get: async (d) => ({ ...d, token: "preview" }), set: async () => {} } },
      tabs: { query: async () => [{ id: 1, url: location.href, title: document.title }] },
      scripting: { executeScript: async ({ func }) => [{ result: func() }] },
      permissions: { request: async () => true },
      runtime: { sendMessage: async (m) => { window.sent = m; return { ok: true, result: { count: m.payload.items.length, notes: [] } }; } },
    };
    window.fetch = async (url, init) => {
      const body = init && init.body ? JSON.parse(init.body) : {};
      const result = body.method === "capture.options"
        ? { library: "My Library", projects: [{ id: "p1", title: "AI literacy in communication education" }], active_project: "p1", collections: [{ id: "c1", name: "Faculty learning", project_id: "" }], labels: ["Teaching practice"] }
        : { found: true, by: "DOI", title: "Teaching with generative AI" };
      return new Response(JSON.stringify({ result }), { status: 200 });
    };
    void extractPage;
    await import("../../extension/popup.js");
  </script>
</body>
</html>
