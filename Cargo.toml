[workspace]
resolver = "2"
members = ["crates/prm-core", "app/src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
authors = ["Jason S. Wrench"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
regex = "1"
unicode-normalization = "0.1"
strsim = "0.11"
csv = "1"
lopdf = "0.47"
ureq = { version = "2", features = ["json"] }

[profile.release]
# Unwind so a failure inside a third-party renderer is caught and reported, not fatal.
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# citationberg 0.7.0 (the newest release) needs quick-xml 0.38, which has RUSTSEC-2026-0195.
# This copy differs only in asking for quick-xml 0.42. Remove it when a release moves past 0.38.
[patch.crates-io]
citationberg = { path = "vendor/citationberg" }
